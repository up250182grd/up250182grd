name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unitarias + integración con MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers usa el Docker del runner para levantar MySQL 8.4.
      - run: mvn -B verify

  frontend:
    name: Frontend (tipos, lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Si el contrato del backend cambió y no se regeneró el cliente, este paso falla.
      - run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

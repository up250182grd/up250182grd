# EnglishOS — configuración base. Los valores sensibles se leen SIEMPRE de variables de entorno
# (ver .env.example en la raíz del repositorio). Perfiles: dev, test, prod.
spring:
  application:
    name: englishos
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/englishos}
    username: ${DB_USER:englishos}
    password: ${DB_PASSWORD:}
    hikari:
      # READ COMMITTED evita los gap locks de InnoDB en búsquedas por rango, que causaban deadlocks con
      # operaciones concurrentes (ver ConcurrentRegistrationIT). La consistencia se garantiza con
      # restricciones UNIQUE, bloqueos explícitos de fila (SELECT ... FOR UPDATE) y versiones optimistas.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: ENGLISHOS_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  # native = RemoteIpValve de Tomcat: solo acepta X-Forwarded-* de proxies de red interna (Caddy/nginx en la red de
  # Docker). Un cliente externo no puede falsear su IP para saltarse los límites de peticiones.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # Una caída momentánea del SMTP no debe marcar todo el backend como no sano (los envíos fallidos se registran
    # y el usuario puede pedir el correo de nuevo).
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM:EnglishOS <no-reply@englishos.local>}
  security:
    max-failed-logins: 5
    lock-duration: 15m
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  legal:
    terms-version: ${LEGAL_TERMS_VERSION:2026-11-draft}
    privacy-version: ${LEGAL_PRIVACY_VERSION:2026-11-draft}
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Administrador}
  ai:
    # fake = profesor simulado (sin red ni costo real); openai = proveedor real (requiere OPENAI_API_KEY).
    provider: ${AI_PROVIDER:fake}
    # Debe existir en Administración → Precios con una tarifa vigente.
    text-model: ${AI_TEXT_MODEL:fake-tutor-1}
    # Voz en tiempo real: fake = llamada simulada sin audio; openai = WebRTC real (requiere OPENAI_API_KEY).
    voice-provider: ${AI_VOICE_PROVIDER:fake}
    realtime-model: ${AI_REALTIME_MODEL:fake-voice-1}
    realtime-voice: ${AI_REALTIME_VOICE:alloy}
    # Transcripción de lo que dice el alumno durante la llamada (solo con voice-provider=openai).
    realtime-transcription-model: ${AI_REALTIME_TRANSCRIPTION_MODEL:gpt-live-transcribe}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: 60s
  tutor:
    max-output-tokens: 600
    max-message-chars: 2000
    max-turns: 60
    history-messages: 20
    initial-reserve-mxn: 5.00
    idle-timeout: 30m
    idle-check: PT5M
  voice:
    max-minutes: 15
    min-minutes: 2
    max-output-tokens: 400
    # La reserva cubre los minutos estimados × margen; al medir el 90 % se amplía o se corta (RN-23).
    reserve-margin: 1.20
    cut-ratio: 0.90
    heartbeat-timeout: 30s
    end-grace: 3s
    warn-before: 60s
    watchdog-period: 2s
    # Unidades estimadas por minuto de conversación (solo para el estimado previo; el cobro usa lo medido).
    estimate:
      text-in-per-minute: 1500
      audio-in-per-minute: 600
      audio-out-per-minute: 900
      text-out-per-minute: 200
  privacy:
    # Plazo de conservación de transcripciones y mensajes de conversaciones cerradas (RNF-11). El audio no se guarda.
    transcript-retention: ${TRANSCRIPT_RETENTION:180d}
    retention-cron: "0 30 3 * * *"
  # Límites de peticiones (RNF-16). Por IP en rutas públicas; por usuario en rutas con sesión.
  rate-limit:
    enabled: true
    rules:
      login: { method: POST, path: /api/v1/auth/login, limit: 10, window: 1m, by: IP }
      register: { method: POST, path: /api/v1/auth/register, limit: 5, window: 10m, by: IP }
      verify-email: { method: POST, path: /api/v1/auth/verify-email, limit: 20, window: 10m, by: IP }
      resend-verification: { method: POST, path: /api/v1/auth/resend-verification, limit: 5, window: 10m, by: IP }
      password-reset: { method: POST, path: "/api/v1/auth/password-reset/**", limit: 5, window: 10m, by: IP }
      tutor-start: { method: POST, path: /api/v1/tutor/conversations, limit: 10, window: 10m, by: USER }
      tutor-message: { method: POST, path: "/api/v1/tutor/conversations/*/messages", limit: 20, window: 1m, by: USER }
      voice-start: { method: POST, path: /api/v1/voice/sessions, limit: 5, window: 10m, by: USER }
      topups: { method: POST, path: /api/v1/me/wallet/topups, limit: 10, window: 10m, by: USER }
      simulated-topups: { method: POST, path: /api/v1/me/wallet/simulated-topups, limit: 10, window: 10m, by: USER }
      webhook: { method: POST, path: /api/v1/webhooks/mercadopago, limit: 120, window: 1m, by: IP }
      vocabulary: { method: POST, path: "/api/v1/vocabulary/**", limit: 120, window: 1m, by: USER }
      practice: { method: POST, path: "/api/v1/practice/**", limit: 120, window: 1m, by: USER }
  payments:
    # none = sin pasarela (solo recargas simuladas si están activas); mercadopago = Checkout Pro (modo prueba).
    provider: ${PAYMENTS_PROVIDER:none}
    # URL pública HTTPS del webhook (…/api/v1/webhooks/mercadopago). Vacía: se configura en el panel del proveedor.
    notification-url: ${PAYMENTS_NOTIFICATION_URL:}
    reconcile-every: PT15M
    mercadopago:
      access-token: ${MP_ACCESS_TOKEN:}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      base-url: ${MP_BASE_URL:https://api.mercadopago.com}
      # true: usa el enlace de pago de pruebas (sandbox_init_point) — ningún cobro es real.
      test-mode: ${MP_TEST_MODE:true}
  vocabulary:
    # Tarjetas nuevas por día (RF-SRS-3) y tamaño máximo de la cola diaria.
    new-cards-per-day: 10
    max-queue: 50
  billing:
    # Sobregiro técnico máximo (RN-24) y tope mensual del consumo interno del administrador (RN-8).
    overdraft-limit-mxn: 10.00
    admin-monthly-cap-mxn: ${ADMIN_MONTHLY_CAP_MXN:1000.00}
    min-topup-mxn: 100.00
    max-topup-mxn: 2000.00
    # Recargas simuladas (sin cobro real). Solo para desarrollo/pruebas; en producción, false.
    simulated-topups-enabled: ${SIMULATED_TOPUPS_ENABLED:false}

logging:
  level:
    root: INFO

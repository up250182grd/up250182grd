# Cabeceras de seguridad. Se incluyen en CADA location que use add_header: en nginx, un add_header dentro de un
# location anula los del nivel server (por eso no basta con declararlas una vez).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
# La voz usa WebRTC: la negociación SDP pasa por el backend (mismo origen) y el audio no lo regula connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

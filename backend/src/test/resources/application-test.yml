# Perfil de pruebas: la base de datos la aporta Testcontainers (@ServiceConnection).
server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true

app:
  base-url: http://localhost:5173
  billing:
    simulated-topups-enabled: true
  scheduling:
    enabled: false
  # Las pruebas registran decenas de usuarios desde 127.0.0.1; RateLimitIT lo activa con límites bajos.
  rate-limit:
    enabled: false
  ai:
    fake-voice:
      tick: PT0.3S
  voice:
    heartbeat-timeout: 3s
    end-grace: 500ms
    watchdog-period: 300ms
  admin-bootstrap:
    email: admin@englishos.test
    password: Owner-Secret-Phrase-2026
    display-name: Admin de pruebas
